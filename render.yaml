# One-click deploy to Render: https://render.com/deploy
services:
  - type: web
    name: shas-radar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Optional AI "find connections" feature (app/ai.py, README's "AI
      # connections" section) -- set any one of these in the Render dashboard
      # to turn it on; leave all three unset and the app runs exactly as
      # before, with that one button simply unavailable.
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
