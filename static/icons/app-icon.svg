      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#090D1A"/>
      <stop offset="100%" stop-color="#02040A"/>
    </radialGradient>
    <linearGradient id="goldCenterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
