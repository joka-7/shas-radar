name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff mypy pytest-cov

      - name: Ruff
        run: ruff check .

      - name: Mypy (strict)
        run: mypy app

      # The floor is set just under the measured 97% rather than at a round
      # aspirational number: a gate that fails the day it lands gets disabled.
      - name: Tests with a coverage gate
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=95

  docs-drift:
    name: Docs tree is current
    runs-on: ubuntu-latest
    steps:
      # docs/STRUCTURE.md is generated from the real tree. A directory map that
      # nothing verifies drifts silently and becomes actively misleading, so
      # this fails the build when the committed tree no longer matches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Both generated trees are checked: the full one in docs/ and the depth-1
      # summary in the README. Checking only one lets the other rot.
      - name: Check the generated trees against the repository
        run: |
          python scripts/gen_tree.py --project . --output docs/STRUCTURE.md --check
          python scripts/gen_tree.py --project . --output README.md --max-depth 1 --check

  frontend-drift:
    name: Frontend bundle is current
    runs-on: ubuntu-latest
    steps:
      # static/vendor/model-picker/ (the AI settings dialog's <ModelPicker>
      # island -- see frontend/, README's "Frontend build step") is built,
      # not hand-written. Same reasoning as docs-drift above, applied to a
      # generated bundle instead of a generated tree: nothing else verifies
      # it, so it fails the build when the committed output doesn't match a
      # fresh build of frontend/'s source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Check the committed bundle against a fresh build
        run: git diff --exit-code -- static/vendor/model-picker
